# SIM_ONLY move_base graph validation parameters. No goal is sent by default.
metadata:
  status: WORKING_ASSUMPTION
  scope: SIM_ONLY
shutdown_costmaps: false
controller_frequency: 5.0
controller_patience: 5.0
planner_frequency: 1.0
planner_patience: 5.0
# Human-guided goals have no coordinator deadline; fail instead of remaining ACTIVE forever.
oscillation_timeout: 15.0
oscillation_distance: 0.05
recovery_behavior_enabled: false
base_global_planner: navfn/NavfnROS
base_local_planner: dwa_local_planner/DWAPlannerROS
NavfnROS:
  allow_unknown: false
DWAPlannerROS:
  max_vel_x: 0.15
  min_vel_x: 0.0
  max_vel_trans: 0.15
  min_vel_trans: 0.0
  max_vel_theta: 0.25
  min_vel_theta: 0.02
  # Conservative SIM_ONLY dynamic window; final velocity remains capped below the Safety Gate.
  acc_lim_x: 0.5
  acc_lim_y: 0.5
  acc_lim_theta: 1.0
  holonomic_robot: true
  max_vel_y: 0.12
  min_vel_y: -0.12
  xy_goal_tolerance: 0.2
  yaw_goal_tolerance: 0.1
  latch_xy_goal_tolerance: true
  sim_time: 1.5
  sim_granularity: 0.025
  angular_sim_granularity: 0.025
  vx_samples: 6
  vy_samples: 5
  vth_samples: 20
  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.02
  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  oscillation_reset_dist: 0.05
  trans_stopped_vel: 0.01
  theta_stopped_vel: 0.02
  publish_traj_pc: true
  publish_cost_grid_pc: true
